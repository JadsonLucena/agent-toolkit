name: Toolkit validation

on:
  pull_request:
  # Validate pushed feature branches before opening a pull request.
  push:

permissions:
  contents: read

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Structural architecture lint
        run: python3 scripts/toolkit_lint.py
      - name: Requirements evaluation catalog
        run: python3 scripts/requirements_evals.py
      - name: Review SDD evaluation catalog
        run: python3 scripts/requirements_evals.py --catalog evals/review/cases.json
      - name: Review correctness evaluation catalog (structure only)
        run: python3 scripts/requirements_evals.py --catalog evals/review/correctness-cases.json
      - name: HTTP API evaluation catalog (structure only)
        run: python3 scripts/requirements_evals.py --catalog evals/api/cases.json
      - name: Relational data evaluation catalog (structure only)
        run: python3 scripts/requirements_evals.py --catalog evals/data/cases.json
      - name: Delivery SDD evaluation catalog
        run: python3 scripts/requirements_evals.py --catalog evals/delivery/cases.json
      - name: Context Engineering evaluation catalog
        run: python3 scripts/requirements_evals.py --catalog evals/context/cases.json
      - name: Capability routing evaluation catalog (structure only)
        run: python3 scripts/routing_evals.py --catalog evals/routing/cases.json
      - name: Claude plugin static coverage (host not tested)
        run: python3 scripts/claude_plugin_lint.py
      - name: Pinned Cloudflare security guidance integrity
        run: python3 -m unittest discover -s tests -p 'test_security_audit_adapter.py' -v
      - name: Linter regression tests
        run: python3 -m unittest discover -s tests -v
